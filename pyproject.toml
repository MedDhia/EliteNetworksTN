[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elitenet"
version = "0.1.0"
description = "Longitudinal Tunisian elite network dataset (2008-2012) from the Journal Officiel"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rapidfuzz>=3.6",
    "pandas>=2.0",
    "networkx>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
