name: CI

# Two things are worth catching automatically in a dataset repository:
#
#  1. the parsers still read the sources the way the tests say they do, and
#  2. the committed tables are still the ones the committed inputs and code
#     produce.
#
# The second matters more than it sounds. The data files here are the
# deliverable, and a subtle extraction change can alter thousands of rows
# without touching a test. Rebuilding and diffing makes that impossible to
# merge unnoticed: either the tables are regenerated in the same commit, or CI
# says they drifted.

on:
  pull_request:
  push:
    # Only the default branch. A PR branch is already covered by the
    # pull_request trigger, and listening to both runs every job twice on
    # every push. `main` is listed too so this keeps working if the default
    # branch is later renamed to the conventional one.
    branches: [claude/laughing-bohr-10y8iy, main]
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Runtime deps are split across two files: pyproject carries the JORT
      # package's own (httpx, rapidfuzz), requirements.txt the rest including
      # the bourse component's PDF stack. Both are needed to import every
      # module the test suite touches.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -q

  multiplex-consistency:
    name: 2008-2012 multiplex dataset is self-consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -r requirements.txt

      # Reads the committed CSVs under data/processed/multiplex-2008-2012/, so
      # it needs no gazette mirror. --strict exits non-zero when the dataset
      # contradicts itself: a spell that ends before it begins, an act
      # published before it happened, or a resolved link with no organisation
      # agreement.
      #
      # Three checks cannot run here and report themselves skipped at WARN:
      # the verbatim-quote guard, the negative control, and the act-citation
      # graph all read data/interim/, a git-ignored intermediate rebuilt from
      # the mirror. They are exercised locally before each push instead. The
      # run rewrites docs/VALIDATION-multiplex-2008-2012.md with those WARNs;
      # nothing diffs docs/, so the committed report stays the full-input one.
      - name: Consistency checks
        run: python -m elitenet.validate --strict

  bourse-dataset:
    name: bourse dataset rebuilds reproducibly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -r requirements.txt

      # Rebuilds entities and edge lists from the committed extraction records
      # and the committed BVMT roster. No network access and no PDFs needed:
      # the slow crawl/fetch/extract stages are not re-run here.
      - name: Rebuild the dataset
        run: make bourse-build

      # The political-connection coding is committed output like any other
      # table, and its rules live in a config file that is easy to edit
      # without rebuilding. Re-running it here puts it under the same
      # byte-for-byte diff check as the edge list, so a changed rule cannot
      # reach main without the coded firm-years that follow from it.
      - name: Recode political connections
        run: make bourse-political

      # Both analyses write committed markdown derived from the tables above,
      # so they belong under the same diff check: a changed rule or a changed
      # edge must not leave a stale conclusion in the repository. Both are
      # deterministic - exact betweenness, seeded permutations - so they
      # reproduce byte for byte. The centrality pass is the slow one at about
      # 100s, which is the price of having its numbers verified rather than
      # asserted.
      - name: Re-run the analyses
        run: make bourse-analysis bourse-centrality

      # Director gender is read off honorifics and drives a committed panel
      # and figure, so it goes under the diff too: a change to the honorific
      # sets must not leave the coded genders or the women's series stale.
      - name: Recode director gender and the women's series
        run: make bourse-gender bourse-women

      # Fails the build on any ERROR-level finding (referential integrity,
      # self-loops, ownership weights outside (0, 100]).
      - name: Validate
        run: make bourse-validate

      - name: Committed tables match the rebuild
        run: |
          if ! git diff --exit-code -- data/processed/bourse/; then
            echo "::error::Rebuilding produced different tables than those committed."
            echo "Run 'make bourse-build bourse-validate' and commit the result."
            exit 1
          fi

      # Exercises the muxViz and GraphML writers. Their output is git-ignored,
      # so this is a smoke test for the export path rather than a diff check.
      - name: Export networks
        run: make bourse-export

      - name: Coverage summary
        if: always()
        run: |
          echo "### Bourse dataset" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -n 20 data/processed/bourse/validation_report.md >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # The A'lam Tunisiyun build. Like bourse-dataset this rebuilds from committed
  # inputs and diffs the result, which is possible because the per-page OCR
  # text is committed and every gzipped table is written with the mtime pinned.
  # It also runs the verbatim-quote guard over every edge rather than a sample:
  # a model pass produced most of them, and an assertion that cannot be quoted
  # is the exact shape a fabricated tie would take.
  aalam-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]" -r requirements.txt
      - name: Tests
        run: PYTHONPATH=src python -m pytest tests/test_names_aalam.py tests/test_extract_aalam.py tests/test_gold_aalam.py -q
      - name: Rebuild the dataset
        run: make aalam-segment aalam-extract aalam-model aalam-relations
      - name: Validate
        run: make aalam-validate
      - name: The gold sample is still the one that was drawn
        run: |
          make aalam-gold-draw
          if ! git diff --exit-code -- gold/aalam_sample_edges.csv gold/aalam_sample_passages.csv; then
            echo "::error::Redrawing the gold sample produced a different sample."
            echo "The draw is seeded so a reviewer can check it was not chosen"
            echo "after seeing the results; if the corpus changed, redraw and"
            echo "recode deliberately rather than letting it drift."
            exit 1
          fi
      - name: Committed tables match the rebuild
        run: |
          if ! git diff --exit-code -- data/processed/aalam-tunisiyun/; then
            echo "::error::Rebuilding produced different tables than those committed."
            echo "Run 'make aalam' and commit the result."
            exit 1
          fi
      - name: Coverage summary
        if: always()
        run: head -n 25 docs/VALIDATION-aalam-tunisiyun.md >> "$GITHUB_STEP_SUMMARY"

  # The rodovid build. Cheaper to check than any of the others: the two source
  # sheets are committed as gzipped CSV, the three table stages use the standard
  # library alone, and the whole chain runs in about fifteen seconds, so CI can
  # rebuild from the real inputs rather than from fixtures. pytest is the only
  # thing installed.
  rodovid-dataset:
    name: rodovid genealogies rebuild reproducibly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Tests
        run: make rodovid-test
      - name: Rebuild the dataset
        run: make rodovid-build rodovid-families

      # Not a validation report but a standing check on what the network
      # figures may be read to say: the 5-core is still 236 families and still
      # the deepest core the network has, 955 families still married into the
      # field exactly once, the beylical house is still the widest-married at
      # 160 allies, and closure and modularity are still inside the ceilings
      # that make "a web, not a set of blocs" the right description. Exits
      # non-zero on any of them.
      - name: Audit what the figures claim
        run: make rodovid-audit

      - name: Committed tables match the rebuild
        run: |
          if ! git diff --exit-code -- data/processed/rodovid/; then
            echo "::error::Rebuilding produced different tables than those committed."
            echo "Run 'make rodovid' and commit the result."
            exit 1
          fi
