name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Both builds live in this repository: the state-elite build declares
          # its dependencies in requirements.txt, this one in pyproject.toml.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e '.[dev]'

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Consistency checks
        # Reads the committed CSVs, so it needs no gazette mirror. --strict
        # exits non-zero when the dataset contradicts itself: a spell that ends
        # before it begins, an act published before it happened, or an event
        # whose quote is not in its source block.
        run: python -m elitenet.validate --strict
