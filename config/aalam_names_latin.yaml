# The Latin edition of the registers: every Arabic name, twice.
#
# Nothing here is derived. `name_translit` in the processed tables looks like a
# Latin column and is not one -- it is the vowel-less consonant skeleton that
# generates the identifiers, so `سالم بو حاجب` comes out `SALM BW HAJB`. Arabic
# script does not write short vowels, so no procedure recovers `Salem` from
# that. Every form below was supplied.
#
# Two conventions, because the readers differ:
#   fr     Tunisian French, as the archives and the gazette build spell these
#          people (Mohamed Tahar Ben Achour, Bechir Sfar). This is also the
#          author's own orthography: Zmerli wrote in French, and the volume is
#          Hammadi Sahli's Arabic rendering of him.
#   ijmes  Middle East studies convention, no diacritics (Muhammad al-Tahir
#          Ibn Ashur). What an Anglophone literature indexes these people under.
#
# `mode` says what kind of rendering it is:
#   transliterated  renders the Arabic, and is checked against it consonant by
#                   consonant by `aalam.romanise.spines_agree`, on every row.
#   conventional    the body's own French name, which is not a rendering of its
#                   Arabic one: Collège Sadiki for المدرسة الصادقية, Lycée
#                   Carnot for معهد كارنو. Only `fr` may be conventional; the
#                   `ijmes` side still transliterates and is still gated.
#   translated      a common-noun post or a description, where transliterating
#                   would mean nothing: `وزير الداخلية` is Minister of the
#                   Interior, and `الأساتذة الذين ساهموا في تكوينهما` is a group
#                   the book characterises, not a person it names. Reading one
#                   of these as a proper name is the error the mode prevents.
#
# `tier` says how much to trust it. `verified` is the 38 subjects plus the
# institutions and alters with three or more ties -- the rows a reader meets,
# checked by hand against the volume. `romanised` is the tail. `described` is
# the rows that are not names.
#
# The gate catches a gloss attached to the wrong name: it refuses `مصطفى آغة`
# as Mustapha Radhouane, which is the homonym merge the gold coding caught
# (GOLD-FINDINGS s6). It cannot see a vowel -- Salim, Salem and Sulaym are one
# spine -- and that is why the rows that matter are verified rather than gated.
# docs/LIMITATIONS-aalam-tunisiyun.md s10.

# The author's three generations. His judgement about his subjects, not an
# attribute of the people, which is why the English keeps the definite article
# he uses rather than turning them into period labels.
cohorts:
  "السابقون": "The predecessors"
  "التابعون": "The followers"
  "المعاصرون": "The contemporaries"

# The subtitle the volume prints under each subject's dates. Five of the 38 are
# not subtitles at all: OCR took a sentence out of the body of the essay, and
# the English below says what that fragment says rather than repairing it into
