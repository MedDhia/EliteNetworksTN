# Temporal and source scope of the dataset. Single source of truth for every stage.
# The full range the sources support, which is what "maximum" means here:
#   journal-officiel  1957-2026  6,378 French issues  (state appointments)
#   annonces-legales  2004-2026  3,404 French issues  (corporate, associations)
# So 1957-2003 carries state acts only -- the commercial register does not go
# back that far -- and corporate ties are structurally absent before 2004.
# Counted from the catalog snapshot in data/raw/compliance/.
#
# The years list is DERIVED from these bounds (paths.window_years); it is no
# longer written out, because a hand-maintained list that disagreed with the
# window would mirror one range and analyse another.
window:
  start: "1957-01-01"
  end: "2026-12-31"

# Only French issues are OCR'd by the upstream mirror, so only French is usable.
language: fr

collections:
  - journal-officiel     # laws, decrees, arretes -> state appointments
  - annonces-legales     # corporate, shareholding, associations (starts 2004)
  # tribunal-immobilier is deliberately excluded: zero French OCR (Arabic only).

endpoints:
  catalog: "https://index.jort.tn/catalog"
  ocr_pattern: "https://ocr.jort.tn/{collection}/{lang}/{year}/{issue}.md"
  pdf_pattern: "https://lake.jort.tn/{collection}/{lang}/{year}/{issue}.pdf"
  viewer_pattern: "https://jort.tn/view/{collection}/{lang}/{year}/{issue}"
  search: "https://api.jort.tn/search"
  facets: "https://api.jort.tn/search/facets"

http:
  concurrency: 6
  timeout_seconds: 60
  max_retries: 5
  backoff_base_seconds: 2
  user_agent: "EliteNetworksTN/0.1 (academic research; contact via repository)"

panel:
  # Monthly as well as yearly: the January 2011 rupture is invisible at annual
  # resolution.
  frequencies: [yearly, monthly]
  # But monthly is only materialised around the rupture. Over the full window
  # that would be 840 periods, and two things make them worthless: a month is
  # shorter than the gazette's publication lag, so month-to-month change is
  # mostly reporting noise rather than turnover, and the per-period networks
  # are extremely sparse. Yearly covers the whole window either way.
  monthly_window:
    start: "2008-01-01"
    end: "2014-12-31"

# --- organisation identity -------------------------------------------------
# A seed organisation's label can be a short common word once legal-form words
# are stripped: "SOCIETE TROIS" normalises to "TROIS", the French for three.
# `fuzz.token_set_ratio` then treats containment as identity -- it returns 1.0
# whenever the seed label's tokens are a subset of the mention's, however much
# else the mention says -- so that node absorbed every mention containing the
# word and became the highest-degree organisation in the org-org layer.
#
# The fix is to require the match to rest on a token that actually
# discriminates, measured by how many DISTINCT organisation mentions in this
# corpus contain it. CONSULTING appears in 4,738 of 199,608; SFBT in 3. Token
# count is not the signal: most single-token seed labels are proper names
# (SFBT, TUNISAIR, CONECT) where containment matching is correct.
org_identity:
  # A token is discriminating below this share of distinct org mentions.
  # 0.0005 is about 100 mentions. The narrowest observed gap is TROIS (143,
  # generic) against TUNISAIR (22, distinctive), so this is a judgement of
  # roughly 6x headroom rather than a sharp boundary -- `make orgentity`
  # reports the hub count at 0.0002 / 0.0005 / 0.001 so the choice stays
  # visible instead of being buried here.
  discriminating_df_share: 0.0005
  # Below this many distinct mentions, document frequency is too noisy to
  # gate on, so every token counts as discriminating and the old behaviour
  # holds. Guards the small fixtures the tests run against.
  min_corpus_mentions: 500

snowball:
  # How many times what one pass named may become the anchor for what it
  # could not. The loop is monotone -- rule 1 only fires where an
  # organisation is unnamed, rules 2 and 3 only where a person is, and
  # neither can fire again on a row it has named -- so it converges on its
  # own and stops as soon as a pass adds nothing. This is therefore a safety
  # bound, not a tuning knob: it exists so a bug cannot spin forever, and it
  # is set high enough not to bind. `resolution.csv` records `resolve_pass`
  # on every row, so the marginal yield of each round is visible and any
  # round can be dropped after the fact.
  max_passes: 12
