# Temporal and source scope of the dataset. Single source of truth for every stage.
# The full range the sources support, which is what "maximum" means here:
#   journal-officiel  1957-2026  6,378 French issues  (state appointments)
#   annonces-legales  2004-2026  3,404 French issues  (corporate, associations)
# So 1957-2003 carries state acts only -- the commercial register does not go
# back that far -- and corporate ties are structurally absent before 2004.
# Counted from the catalog snapshot in data/raw/compliance/.
#
# The years list is DERIVED from these bounds (paths.window_years); it is no
# longer written out, because a hand-maintained list that disagreed with the
# window would mirror one range and analyse another.
window:
  start: "1957-01-01"
  end: "2026-12-31"

# Only French issues are OCR'd by the upstream mirror, so only French is usable.
language: fr

collections:
  - journal-officiel     # laws, decrees, arretes -> state appointments
  - annonces-legales     # corporate, shareholding, associations (starts 2004)
  # tribunal-immobilier is deliberately excluded: zero French OCR (Arabic only).

endpoints:
  catalog: "https://index.jort.tn/catalog"
  ocr_pattern: "https://ocr.jort.tn/{collection}/{lang}/{year}/{issue}.md"
  pdf_pattern: "https://lake.jort.tn/{collection}/{lang}/{year}/{issue}.pdf"
  viewer_pattern: "https://jort.tn/view/{collection}/{lang}/{year}/{issue}"
  search: "https://api.jort.tn/search"
  facets: "https://api.jort.tn/search/facets"

http:
  concurrency: 6
  timeout_seconds: 60
  max_retries: 5
  backoff_base_seconds: 2
  user_agent: "EliteNetworksTN/0.1 (academic research; contact via repository)"

panel:
  # Monthly as well as yearly: the January 2011 rupture is invisible at annual
  # resolution.
  frequencies: [yearly, monthly]
  # But monthly is only materialised around the rupture. Over the full window
  # that would be 840 periods, and two things make them worthless: a month is
  # shorter than the gazette's publication lag, so month-to-month change is
  # mostly reporting noise rather than turnover, and the per-period networks
  # are extremely sparse. Yearly covers the whole window either way.
  monthly_window:
    start: "2008-01-01"
    end: "2014-12-31"
