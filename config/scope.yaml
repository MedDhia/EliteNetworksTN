# Temporal and source scope of the dataset. Single source of truth for every stage.
window:
  start: "2008-01-01"
  end: "2012-12-31"
  years: [2008, 2009, 2010, 2011, 2012]

# Only French issues are OCR'd by the upstream mirror, so only French is usable.
language: fr

collections:
  - journal-officiel     # laws, decrees, arretes -> state appointments
  - annonces-legales     # corporate, shareholding, associations (starts 2004)
  # tribunal-immobilier is deliberately excluded: zero French OCR (Arabic only).

endpoints:
  catalog: "https://index.jort.tn/catalog"
  ocr_pattern: "https://ocr.jort.tn/{collection}/{lang}/{year}/{issue}.md"
  pdf_pattern: "https://lake.jort.tn/{collection}/{lang}/{year}/{issue}.pdf"
  viewer_pattern: "https://jort.tn/view/{collection}/{lang}/{year}/{issue}"
  search: "https://api.jort.tn/search"
  facets: "https://api.jort.tn/search/facets"

http:
  concurrency: 6
  timeout_seconds: 60
  max_retries: 5
  backoff_base_seconds: 2
  user_agent: "EliteNetworksTN/0.1 (academic research; contact via repository)"

panel:
  # Monthly as well as yearly: the January 2011 rupture is invisible at annual resolution.
  frequencies: [yearly, monthly]
